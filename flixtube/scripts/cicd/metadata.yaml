#
# To deploy:
#
# kubectl apply -f scripts/deploy.yaml
#
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: flixtube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata
  template:
    metadata:
      labels:
        app: metadata
    spec:
      containers: 
      - name: metadata
        image: $CONTAINER_REGISTRY_IP:$CONTAINER_REGISTRY_PORT/$CONTAINER_REGISTRY_ORGANIZATION/$CONTAINER_REGISTRY_REPOSITORY/$IMAGE_NAME:$IMAGE_VERSION
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: FLIXTUBE_METADATA_PORT
          value: "4030"
        - name: FLIXTUBE_METADATA_CONNECTION_STRING
          value: Data Source=db,1433;Initial Catalog=metadata;User Id=sa;Password=P@55w0rd;Encrypt=Yes;TrustServerCertificate=Yes;MultipleActiveResultSets=True;
        - name: FLIXTUBE_METADATA_SEED_DATABASE
          value: "False"
        - name: FLIXTUBE_RABBIT_MQ_HOST
          value: amqp://rabbit_user:rabbit_password@rabbit:5672
        ports:
        - containerPort: 4030
---
apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: flixtube
spec:
  selector:
    app: metadata
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 4030
      targetPort: 4030
