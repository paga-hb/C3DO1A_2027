# 
# GitHub Actions workflow to build and deploy the Flixtube.Web microservice
#

# This is the name of the workflow, displayed under GitHub Actions
name: Deploy Flixtube.Web

# Controls when the workflow will run
on:

  # Triggers the workflow on push to the main branch but only when changes have been made to the Flixtube.Web subfolder
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - Flixtube.Web/**

  # Triggers the workflow on pull_request to the main branch but only when changes have been made to the Flixtube.Web subfolder
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - Flixtube.Web/**
  
  # Allows deployment to be invoked manually through the GitHub Actions user interface.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "deploy"
  deploy:
    
    # Runs on the latest version of Ubuntu
    runs-on: ubuntu-latest
    
    # Environment variables that are available to all the steps in this job
    # "github.sha" is the hash of the commit that triggered the workflow
    # "secrets.<NAME>" is a SECRET defined under "Settings -> Actions -> Secrets" (can be set on the organization or repository level)
    # "vars.<NAME>" is a VARIABLE defined under "Settings -> Actions -> Variables" (can be set on the organization or repository level)
    env:     
      CONTAINER_REGISTRY_IP: ${{ vars.CONTAINER_REGISTRY_IP }}
      CONTAINER_REGISTRY_PORT: ${{ vars.CONTAINER_REGISTRY_PORT }}
      CONTAINER_REGISTRY_ORGANIZATION: ${{ vars.CONTAINER_REGISTRY_ORGANIZATION }}
      CONTAINER_REGISTRY_REPOSITORY: ${{ vars.CONTAINER_REGISTRY_REPOSITORY }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      IMAGE_NAME: web
      IMAGE_VERSION: ${{ gitea.sha }}
      MICROSERVICE_NAME: web
      MICROSERVICE_DIRECTORY: Flixtube.Web

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      
      # Checks-out your repository (under $GITHUB_WORKSPACE).
      - uses: actions/checkout@v3

      # Installs gettext so that the envsubst command is available.
      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      # Builds the Docker image.
      - name: Build
        run: chmod +x ./scripts/cicd/build-image.sh && ./scripts/cicd/build-image.sh

      # Publishes the Docker image to the Azure Container Registry.
      - name: Publish
        run: chmod +x ./scripts/cicd/push-image.sh && ./scripts/cicd/push-image.sh

      # Installs Kubectl and connects it to the cluster.
      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.BASE64_KUBE_CONFIG }}
          kubectl-version: v1.24.2
      
      # Expands the configuration template and deploys the microservice.
      - name: Deploy
        run: chmod +x ./scripts/cicd/deploy.sh && ./scripts/cicd/deploy.sh